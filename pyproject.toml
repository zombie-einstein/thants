[project]
name = "thants"
version = "0.3.4"
description = "Ants! On your GPU! With JAX!"
readme = "README.md"
authors = [
    { name = "zombie-einstein", email = "zombie-einstein@proton.me" }
]
maintainers = [
    { name = "zombie-einstein", email = "zombie-einstein@proton.me" }
]
keywords = [
  "agent-based modelling",
  "simulation",
  "reinforcement-learning",
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Environment :: GPU",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Artificial Life",
]
requires-python = ">=3.12"
dependencies = [
    "chex==0.1.90",
    "jumanji>=1.1.2",
]

[project.urls]
repository = "https://github.com/zombie-einstein/thants"
homepage = "https://github.com/zombie-einstein/thants"
issues = "https://github.com/zombie-einstein/thants/issues"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
test = { cmd = "pytest tests", help="Run tests"}
lint = { cmd = "pre-commit run --all-files", help="Code format checks"}
